<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Urban Barber - Agendamento de Horários</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <main class="container">

        <header>
            <h1>Urban Barber</h1>
            <p class="subtitulo">Agende seu horário!</p>
        </header>

        {% if erro %}
            <div role="alert" aria-live="assertive">
                <p style="color: #b71c1c; background-color: #ffebee; border: 1px solid #ffcdd2; padding: 10px; border-radius: 5px; font-weight: bold;">
                    {{ erro }}
                </p>
            </div>
        {% endif %}

        {% if sucesso %}
            <div role="status" aria-live="polite">
                <p style="color: #1b5e20; background-color: #e8f5e9; border: 1px solid #c8e6c9; padding: 10px; border-radius: 5px; font-weight: bold;">
                    {{ sucesso }}
                </p>
            </div>
        {% endif %}

        <form method="POST" id="formAgendamento" action="/" novalidate>
            <input type="hidden" name="editar_id" value="{{ request.args.get('editar_id') or '' }}">

            <!-- Dados Pessoais -->
            <label for="nome">Nome:</label>
            <div class="tooltip">
                <input 
                    type="text" 
                    id="nome"
                    name="nome" 
                    placeholder="Nome completo" 
                    value="{{ request.args.get('nome', '') }}"
                    aria-describedby="dica-nome"
                    required
                >
                <span id="dica-nome" class="tooltiptext">Adicione seu Nome + Sobrenome</span>
            </div>

            <!-- Integração ViaCEP -->
            <label for="cep">CEP:</label>
            <div class="tooltip">
                <input 
                    type="text" 
                    id="cep" 
                    name="cep" 
                    placeholder="00000-000" 
                    maxlength="9"
                    aria-describedby="dica-cep"
                    onblur="buscarCEP(this.value)"
                >
                <span id="dica-cep" class="tooltiptext">Digite o CEP para buscar endereço</span>
            </div>

            <div class="linha-dupla">
                <div>
                    <label for="logradouro">Logradouro:</label>
                    <input type="text" id="logradouro" name="logradouro" placeholder="Rua / Av" readonly tabindex="-1">
                </div>
                <div>
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" placeholder="Bairro" readonly tabindex="-1">
                </div>
            </div>

            <div class="linha-dupla">
                <div>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Cidade" readonly tabindex="-1">
                </div>
                <div>
                    <label for="estado">UF:</label>
                    <input type="text" id="estado" name="estado" placeholder="UF" readonly tabindex="-1">
                </div>
            </div>

            <!-- Seleção de Serviço -->
            <label for="servico">Serviço:</label>
            <div class="tooltip">
                <select name="servico" id="servico" aria-describedby="dica-servico" onchange="carregarHorariosDinamicos()">
                    <option value="Corte" data-id="1" {% if request.args.get('servico') == 'Corte' %}selected{% endif %}>Corte (60 min)</option>
                    <option value="Barba" data-id="2" {% if request.args.get('servico') == 'Barba' %}selected{% endif %}>Barba (30 min)</option>
                    <option value="Corte + Barba" data-id="3" {% if request.args.get('servico') == 'Corte + Barba' %}selected{% endif %}>Corte + Barba (60 min)</option>
                    <option value="Sobrancelha" data-id="4" {% if request.args.get('servico') == 'Sobrancelha' %}selected{% endif %}>Sobrancelha (30 min)</option>
                </select>
                <span id="dica-servico" class="tooltiptext">Escolha qual serviço deseja realizar</span>
            </div>

            <!-- Seleção de Data -->
            <label for="dataInput">Data:</label>
            <div class="tooltip">
                <input 
                    type="date" 
                    name="data" 
                    id="dataInput"
                    value="{{ request.args.get('data', '') }}"
                    aria-describedby="dica-data"
                    onchange="carregarHorariosDinamicos()"
                    required
                >
                <span id="dica-data" class="tooltiptext">Escolha o dia</span>
            </div>

            <!-- Horários Dinâmicos Carregados via Fetch -->
            <div id="secaoHorarios" style="display: none;">
                <label id="labelHorarios">Horários Disponíveis:</label>
                <p id="horariosStatus" class="status-msg" aria-live="polite"></p>
                <div class="horarios" id="gridHorarios" role="group" aria-labelledby="labelHorarios"></div>
            </div>

            <input 
                type="hidden" 
                name="hora" 
                id="horaSelecionada"
                value="{{ request.args.get('hora', '') }}"
                required
            >

            <button type="submit" id="btnSubmit" style="margin-top: 15px;">
                {% if request.args.get('editar_id') %}
                    Atualizar Agendamento
                {% else %}
                    Agendar
                {% endif %}
            </button>
        </form>

        <!-- Seção do Mapa -->
        <section class="mapa-secao" aria-labelledby="tituloMapa">
            <h2 id="tituloMapa" style="font-size: 16px; margin: 10px 0;">Nossa Localização</h2>
            <iframe 
                class="mapa-frame"
                title="Mapa de localização da barbearia em Taubaté"
                loading="lazy"
                src="https://maps.google.com/maps?q=Taubate,SP&t=&z=14&ie=UTF8&iwloc=&output=embed">
            </iframe>
        </section>

        <!-- Seção da Agenda do Dia -->
        <section id="secaoAgenda" style="display: none; margin-top: 25px;" aria-labelledby="tituloAgenda">
            <h2 id="tituloAgenda">Agendamentos do Dia</h2>
            <div class="agenda" id="containerAgendamentos"></div>
        </section>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
